name: CI Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Qualidade e testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática
        run: ruff check .

      - name: Verificar formatação
        run: ruff format --check .

      - name: Executar testes e cobertura
        run: |
          mkdir -p reports
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=reports/junit.xml

      - name: Guardar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: error
          retention-days: 7

  container-smoke-test:
    name: Build e teste do container
    needs: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Construir a imagem
        run: docker build --tag devops-python-api:${{ github.sha }} .

      - name: Iniciar o container
        run: |
          docker run \
            --detach \
            --name devops-python-api \
            --publish 8000:8000 \
            devops-python-api:${{ github.sha }}

      - name: Verificar o endpoint de saúde
        run: |
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            echo "Tentativa ${attempt}: API ainda não está pronta"
            sleep 1
          done
          exit 1

      - name: Mostrar logs do container
        if: always()
        run: docker logs devops-python-api

      - name: Remover o container
        if: always()
        run: docker rm --force devops-python-api
